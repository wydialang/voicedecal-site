# Builds the site with Jekyll on every push, and deploys
# it to GitHub Pages.
#
# Editing a Markdown file
# on github.com and committing it is enough to update the site.
#
# ---------------------------------------------------------------------------
#  Two phases:
#
#  1. BUILD  — always runs. It compiles the site and fails loudly if a change
#     broke something (bad front matter, broken Liquid, etc.).
#
#  2. DEPLOY — skipped until you create a repository variable named
#     ENABLE_PAGES set to `true`. GitHub Pages does not work on a private repo
#     on a free plan.
#     Then: Settings → Pages → Source = "GitHub Actions", and
#           Settings → Secrets and variables → Actions → Variables →
#           New variable → name ENABLE_PAGES, value true.
#     The next push will deploy. (Also set url/baseurl in _config.yml.)
# ---------------------------------------------------------------------------

name: Build & deploy site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    needs: build
    if: vars.ENABLE_PAGES == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
